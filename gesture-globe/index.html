<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>GESTURE GLOBE · 手势地球仪</title>
<style>
  :root{
    --bg:#04060b;
    --ink:#e8f3ff;
    --dim:#7d93a8;
    --faint:#5d7d95;
    --cyan:#63e6ff;
    --amber:#ffcf7a;
    --rose:#ff8f9c;
    --violet:#b18cff;
    --line:rgba(255,255,255,.10);
    --glass:rgba(7,12,21,.62);
    --mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  #scene{position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; cursor:grab}
  #scene:active{cursor:grabbing}

  .vignette{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background:
      radial-gradient(130% 100% at 50% 42%, transparent 38%, rgba(2,4,10,.72) 100%),
      linear-gradient(180deg, rgba(4,6,11,.55), transparent 22%, transparent 78%, rgba(4,6,11,.6));
  }

  .hud{position:fixed; top:30px; left:34px; z-index:4; pointer-events:none}
  .kicker{
    font:500 10px/1 var(--mono); letter-spacing:.3em; text-transform:uppercase; color:var(--faint);
  }
  .hud h1{
    margin:15px 0 0; font-size:clamp(21px,3.1vw,33px); font-weight:600; letter-spacing:.015em; line-height:1.05;
  }
  .hud h1 em{font-style:normal; color:var(--cyan)}
  .hud p{margin:10px 0 0; font-size:12.5px; color:var(--dim); letter-spacing:.05em}

  .toolbar{position:fixed; top:28px; right:30px; z-index:6; display:flex; gap:10px}
  .chip-btn{
    appearance:none; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
    padding:9px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    color:#b9cfe0; font:500 10.5px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase;
    transition:border-color .2s, color .2s, background .2s;
  }
  .chip-btn:hover{border-color:rgba(99,230,255,.42); color:var(--cyan)}
  .chip-btn.hidden{display:none}
  .chip-btn .live-dot{
    width:6px; height:6px; border-radius:50%; background:#3b4b5e; transition:background .2s, box-shadow .2s;
  }
  .chip-btn[data-live="1"] .live-dot{background:var(--cyan); box-shadow:0 0 10px var(--cyan)}

  .badge{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%); z-index:5;
    display:flex; align-items:center; gap:10px; padding:10px 17px;
    border:1px solid var(--line); border-radius:999px; background:var(--glass);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    font:500 10.5px/1 var(--mono); letter-spacing:.18em; color:#9db4c8; text-transform:uppercase;
    white-space:nowrap; transition:color .25s, border-color .25s;
  }
  .badge .dot{width:6px; height:6px; border-radius:50%; background:#3d4d60; transition:.25s}
  .badge[data-gesture="open"]{color:var(--cyan); border-color:rgba(99,230,255,.32)}
  .badge[data-gesture="open"] .dot{background:var(--cyan); box-shadow:0 0 12px var(--cyan)}
  .badge[data-gesture="pinch"]{color:var(--amber); border-color:rgba(255,207,122,.32)}
  .badge[data-gesture="pinch"] .dot{background:var(--amber); box-shadow:0 0 12px var(--amber)}
  .badge[data-gesture="fist"]{color:var(--rose); border-color:rgba(255,143,156,.32)}
  .badge[data-gesture="fist"] .dot{background:var(--rose); box-shadow:0 0 12px var(--rose)}
  .badge[data-gesture="two"]{color:var(--violet); border-color:rgba(177,140,255,.34)}
  .badge[data-gesture="two"] .dot{background:var(--violet); box-shadow:0 0 12px var(--violet)}

  .hints{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%); z-index:4;
    display:flex; gap:26px; flex-wrap:wrap; justify-content:center; padding:0 18px;
    font:400 11px/1.5 var(--sans); letter-spacing:.05em; color:#6d8399; pointer-events:none;
  }
  .hints b{font-weight:500; color:#a9c2d6}
  .hints span{white-space:nowrap}

  .cam{
    position:fixed; right:28px; bottom:28px; width:230px; z-index:5;
    border:1px solid var(--line); border-radius:16px; overflow:hidden;
    background:rgba(6,11,19,.72); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    opacity:0; transform:translateY(10px); pointer-events:none;
    transition:opacity .4s ease, transform .4s ease;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .cam.live{opacity:1; transform:none}
  .cam .frame{position:relative; aspect-ratio:4/3; overflow:hidden; background:#03060c}
  .cam video, .cam canvas{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1);
  }
  .cam .cap{
    position:absolute; left:10px; top:10px; z-index:2;
    font:500 9px/1 var(--mono); letter-spacing:.16em; color:#8fe8ff;
    background:rgba(3,8,14,.62); padding:6px 8px; border-radius:6px;
    border:1px solid rgba(99,230,255,.18);
  }

  .gate{
    position:fixed; inset:0; z-index:9; display:grid; place-items:center; padding:24px;
    background:radial-gradient(120% 100% at 50% 0%, rgba(12,26,44,.62), rgba(3,5,10,.93));
    backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
    transition:opacity .45s ease, visibility .45s;
  }
  .gate.hidden{opacity:0; visibility:hidden; pointer-events:none}
  .gate-card{
    width:min(440px, 90vw); padding:36px 34px 30px;
    border:1px solid rgba(120,200,255,.14); border-radius:20px;
    background:linear-gradient(180deg, rgba(14,26,43,.9), rgba(6,10,18,.94));
    box-shadow:0 34px 90px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .gate-card .kicker{color:var(--cyan); opacity:.8}
  .gate-card h2{margin:16px 0 0; font-size:27px; font-weight:600; letter-spacing:.02em}
  .gate-sub{margin:12px 0 26px; font-size:13px; line-height:1.75; color:#93aabf}
  .gate-actions{display:flex; gap:12px; flex-wrap:wrap}
  .btn{
    appearance:none; cursor:pointer; border-radius:11px; border:1px solid transparent;
    padding:13px 20px; font:500 13px/1 var(--sans); letter-spacing:.04em;
    transition:filter .2s, background .2s, border-color .2s, color .2s;
  }
  .btn.primary{background:var(--cyan); color:#04121a; box-shadow:0 12px 34px rgba(99,230,255,.22)}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent; color:#9db4c8; border-color:var(--line)}
  .btn.ghost:hover{border-color:rgba(255,255,255,.24); color:#d5e4f0}
  .gate-note{margin:20px 0 0; font-size:11.5px; line-height:1.7; color:#657b90; letter-spacing:.02em}
  .gate-note.err{color:#ffb0a8}

  @media (max-width: 640px){
    .hud{top:20px; left:20px}
    .toolbar{top:18px; right:18px}
    .cam{right:14px; bottom:14px; width:150px; border-radius:12px}
    .hints{gap:14px 20px; font-size:10px; bottom:18px}
    .badge{bottom:74px; padding:8px 13px; font-size:9.5px}
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="3D 地球仪"></canvas>
<div class="vignette"></div>

<header class="hud">
  <div class="kicker">Gesture Controlled · Webcam</div>
  <h1>GESTURE <em>GLOBE</em></h1>
  <p>手掌转动地球 · 捏合缩放 · 握拳刹车</p>
</header>

<div class="toolbar">
  <button id="camToggle" class="chip-btn" data-live="0"><span class="live-dot"></span>手势模式</button>
</div>

<div id="badge" class="badge" data-gesture="none"><span class="dot"></span><span id="badgeLabel">Mouse / Touch</span></div>

<footer class="hints">
  <span><b>OPEN</b> 手掌平移 · 旋转</span>
  <span><b>PINCH</b> 拇指食指捏合 · 上下缩放</span>
  <span><b>FIST</b> 握拳 · 减速</span>
  <span><b>2 HANDS</b> 双手距离 · 缩放</span>
</footer>

<aside id="camPanel" class="cam">
  <div class="frame">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="camOverlay"></canvas>
    <div class="cap" id="camState">CAMERA OFF</div>
  </div>
</aside>

<div id="gate" class="gate">
  <div class="gate-card">
    <div class="kicker">Interactive Globe · 3D</div>
    <h2>用手势转动地球</h2>
    <p class="gate-sub">摄像头画面只在浏览器本地用 MediaPipe 做手部识别，不会离开这台设备。没有摄像头也能用鼠标拖动、滚轮缩放。</p>
    <div class="gate-actions">
      <button id="startBtn" class="btn primary">开启摄像头</button>
      <button id="mouseBtn" class="btn ghost">仅用鼠标</button>
    </div>
    <p class="gate-note" id="gateNote">需要允许摄像头权限；模型与纹理首次加载需要联网。</p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

let THREE;
try {
  THREE = await import('three');
} catch (err) {
  const note = $('gateNote');
  if (note) {
    note.textContent = '3D 引擎加载失败：需要联网访问 CDN。';
    note.classList.add('err');
    $('startBtn').disabled = true;
    $('mouseBtn').disabled = true;
  }
  throw err;
}

const EARTH_TEXS = [
  './vendor/earth_day.jpg',
  'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
  'https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg',
  'https://raw.githubusercontent.com/vasturiano/three-globe/master/example/img/earth-blue-marble.jpg',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/textures/planets/earth_atmos_2048.jpg',
];
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const WASM_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';

const canvas = $('scene');
const gate = $('gate');
const gateNote = $('gateNote');
const startBtn = $('startBtn');
const mouseBtn = $('mouseBtn');
const camToggle = $('camToggle');
const camPanel = $('camPanel');
const camState = $('camState');
const vid = $('video');
const overlay = $('camOverlay');
const octx = overlay.getContext('2d');
const badge = $('badge');
const badgeLabel = $('badgeLabel');

/* ------------------------------------------------------------------ */
/* fallback equirectangular texture (offline-safe)                     */
/* ------------------------------------------------------------------ */
function fallbackTexture() {
  const w = 1024, h = 512;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');

  const ocean = g.createLinearGradient(0, 0, 0, h);
  ocean.addColorStop(0.0, '#0a1a2b');
  ocean.addColorStop(0.42, '#0b2b4a');
  ocean.addColorStop(0.58, '#0c2f50');
  ocean.addColorStop(1.0, '#0a1a2b');
  g.fillStyle = ocean;
  g.fillRect(0, 0, w, h);

  let s = 20240711;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;

  for (let i = 0; i < 240; i++) {
    const x = rnd() * w;
    const y = h * (0.12 + rnd() * 0.76);
    const r = (0.015 + rnd() * 0.065) * h;
    g.beginPath();
    for (let k = 0; k <= 9; k++) {
      const a = (k / 9) * Math.PI * 2;
      const rr = r * (0.55 + rnd() * 0.9);
      const px = x + Math.cos(a) * rr * 1.6;
      const py = y + Math.sin(a) * rr * 0.8;
      k ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath();
    const tone = 0.4 + rnd() * 0.35;
    g.fillStyle = `rgba(${Math.round(24 + tone * 44)}, ${Math.round(58 + tone * 62)}, ${Math.round(42 + tone * 40)}, .72)`;
    g.fill();
  }

  g.globalAlpha = 0.45;
  g.fillStyle = '#dbe6f0';
  g.fillRect(0, 0, w, h * 0.05);
  g.fillRect(0, h * 0.95, w, h * 0.05);
  g.globalAlpha = 1;

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ------------------------------------------------------------------ */
/* scene                                                              */
/* ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 200);
camera.position.set(0, 0, 3.2);

const globe = new THREE.Group();
globe.rotation.set(0.12, 0.6, -0.16);
scene.add(globe);

const earthMat = new THREE.MeshStandardMaterial({
  map: fallbackTexture(),
  roughness: 0.94,
  metalness: 0.02,
});
const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 96), earthMat);
globe.add(earth);

let textureAttempts = 0;
function loadEarthTexture() {
  const loader = new THREE.TextureLoader();
  loader.setCrossOrigin('anonymous');
  const tryNext = (i) => {
    if (i >= EARTH_TEXS.length) {
      if (textureAttempts++ < 2) {
        console.warn('[globe] texture sources failed, retrying…');
        setTimeout(loadEarthTexture, 3500);
      } else {
        console.warn('[globe] no earth texture loaded, keeping procedural fallback');
      }
      return;
    }
    loader.load(EARTH_TEXS[i], (t) => {
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      t.wrapS = THREE.RepeatWrapping;
      earthMat.map = t;
      earthMat.needsUpdate = true;
      console.info('[globe] earth texture:', EARTH_TEXS[i]);
    }, undefined, () => tryNext(i + 1));
  };
  tryNext(0);
}
loadEarthTexture();

/* atmosphere halo */
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.22, 64, 64),
  new THREE.ShaderMaterial({
    transparent: true,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: { uColor: { value: new THREE.Color('#3f9dff') } },
    vertexShader: /* glsl */`
      varying vec3 vN;
      varying vec3 vP;
      void main() {
        vN = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vP = mv.xyz;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uColor;
      varying vec3 vN;
      varying vec3 vP;
      void main() {
        float rim = pow(1.0 - abs(dot(normalize(vN), normalize(vP))), 2.6);
        gl_FragColor = vec4(uColor * rim, rim * 0.9);
      }`,
  })
);
scene.add(atmosphere);

/* lights */
scene.add(new THREE.AmbientLight(0x4a6b8a, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.8);
sun.position.set(4, 1.6, 3.2);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x2f6dff, 1.0);
fill.position.set(-5, -2, -2);
scene.add(fill);

/* stars */
(function stars() {
  const n = 2800;
  const pos = new Float32Array(n * 3);
  const col = new Float32Array(n * 3);
  const warm = new THREE.Color('#ffe7c2');
  const cool = new THREE.Color('#a8ccff');
  for (let i = 0; i < n; i++) {
    const r = 18 + Math.random() * 55;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.cos(phi);
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    const c = Math.random() < 0.14 ? warm : cool;
    const k = 0.3 + Math.random() * 0.7;
    col[i * 3] = c.r * k;
    col[i * 3 + 1] = c.g * k;
    col[i * 3 + 2] = c.b * k;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.2,
    sizeAttenuation: true,
    vertexColors: true,
    transparent: true,
    opacity: 0.92,
    depthWrite: false,
  });
  scene.add(new THREE.Points(geo, mat));
})();

/* ------------------------------------------------------------------ */
/* orbit state                                                        */
/* ------------------------------------------------------------------ */
const ZMIN = 0.5;
const ZMAX = 2.0;
const state = {
  velX: 0,
  velY: 0,
  zoom: 1,
  baseZ: 3.2,
  activeUntil: 0,
};

function fitCamera() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  const halfFov = THREE.MathUtils.degToRad(camera.fov * 0.5);
  const minDist = 1.2 / (Math.tan(halfFov) * Math.min(1, camera.aspect));
  state.baseZ = Math.max(3.05, minDist * 1.06);

  renderer.setSize(w, h, false);
}

/* world-axis rotations (trackball feel) */
const axisY = new THREE.Vector3(0, 1, 0);
const axisX = new THREE.Vector3(1, 0, 0);
const qTmp = new THREE.Quaternion();
function yawBy(a) {
  qTmp.setFromAxisAngle(axisY, a);
  globe.quaternion.premultiply(qTmp);
}
function pitchBy(a) {
  qTmp.setFromAxisAngle(axisX, a);
  globe.quaternion.premultiply(qTmp);
}

let lastRotateAt = performance.now();
function rotateBy(dx, dy) {
  const t = performance.now();
  const dt = clamp((t - lastRotateAt) / 1000, 0.004, 0.14);
  lastRotateAt = t;

  const aY = dx * 2.7;
  const aX = dy * 3.0;
  yawBy(aY);
  pitchBy(aX);

  state.velY = clamp(state.velY * 0.55 + (aY / dt) * 0.45, -9, 9);
  state.velX = clamp(state.velX * 0.55 + (aX / dt) * 0.45, -9, 9);
  state.activeUntil = t + 150;
}

function zoomBy(factor) {
  state.zoom = clamp(state.zoom * factor, ZMIN, ZMAX);
  state.activeUntil = performance.now() + 150;
}

/* ------------------------------------------------------------------ */
/* mouse / touch                                                      */
/* ------------------------------------------------------------------ */
let dragging = false;
let lastPX = 0;
let lastPY = 0;

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastPX = e.clientX;
  lastPY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  setBadge('none', 'Mouse / Touch');
});

canvas.addEventListener('pointermove', (e) => {
  if (!dragging || touchPts.size >= 2) return;
  const dx = (e.clientX - lastPX) / window.innerWidth;
  const dy = (e.clientY - lastPY) / window.innerHeight;
  lastPX = e.clientX;
  lastPY = e.clientY;
  rotateBy(dx, dy);
});

function endDrag() {
  dragging = false;
  lastRotateAt = performance.now();
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const step = clamp(e.deltaY, -120, 120);
  zoomBy(Math.exp(step * 0.0016));
}, { passive: false });

/* two-finger touch pinch */
const touchPts = new Map();
let pinchSpan = 0;
canvas.addEventListener('touchstart', (e) => {
  for (const t of e.changedTouches) touchPts.set(t.identifier, { x: t.clientX, y: t.clientY });
  if (touchPts.size === 2) {
    const [a, b] = [...touchPts.values()];
    pinchSpan = Math.hypot(a.x - b.x, a.y - b.y);
  }
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches) touchPts.set(t.identifier, { x: t.clientX, y: t.clientY });
  if (touchPts.size === 2) {
    const [a, b] = [...touchPts.values()];
    const span = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchSpan > 0) zoomBy(pinchSpan / Math.max(span, 1));
    pinchSpan = span;
    e.preventDefault();
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) touchPts.delete(t.identifier);
  pinchSpan = 0;
}, { passive: true });

/* ------------------------------------------------------------------ */
/* hand tracking                                                      */
/* ------------------------------------------------------------------ */
let landmarker = null;
let cameraStream = null;
let videoReady = false;
let starting = false;
let lastVideoTime = -1;

const HANDS = {
  missed: 0,
  mode: 'none',
  name: 'none',
  pinchOn: false,
  fistOn: false,
  prevPalm: null,
  prevPinch: null,
  prevMid: null,
  prevSpan: 0,
};

const CONNECTIONS = [
  [0, 1], [1, 2], [2, 3], [3, 4],
  [0, 5], [5, 6], [6, 7], [7, 8],
  [5, 9], [9, 10], [10, 11], [11, 12],
  [9, 13], [13, 14], [14, 15], [15, 16],
  [13, 17], [17, 18], [18, 19], [19, 20],
  [0, 17],
];

function setBadge(name, label) {
  if (HANDS.name === name && badgeLabel.textContent === label) return;
  HANDS.name = name;
  badge.dataset.gesture = name;
  badgeLabel.textContent = label;
}

function resetHands() {
  HANDS.prevPalm = null;
  HANDS.prevPinch = null;
  HANDS.prevMid = null;
  HANDS.prevSpan = 0;
  HANDS.pinchOn = false;
  HANDS.fistOn = false;
  HANDS.mode = 'none';
}

function videoAspect() {
  return Math.max(0.2, (vid.videoWidth || 640) / (vid.videoHeight || 480));
}

function handInfo(hand, aspect) {
  const dist = (a, b) => Math.hypot((a.x - b.x) * aspect, a.y - b.y);
  const scale = Math.max(dist(hand[0], hand[9]), 1e-4);
  const palm = {
    x: (hand[0].x + hand[5].x + hand[9].x + hand[13].x + hand[17].x) / 5,
    y: (hand[0].y + hand[5].y + hand[9].y + hand[13].y + hand[17].y) / 5,
  };
  const ext = (dist(hand[8], palm) + dist(hand[12], palm) + dist(hand[16], palm) + dist(hand[20], palm)) / (4 * scale);
  const pinch = dist(hand[4], hand[8]) / scale;
  const pinchPt = { x: (hand[4].x + hand[8].x) / 2, y: (hand[4].y + hand[8].y) / 2 };
  return { hand, palm, ext, pinch, pinchPt };
}

function smoothDelta(prevKey, value, k = 0.45) {
  const prev = HANDS[prevKey];
  if (!prev) {
    HANDS[prevKey] = { x: value.x, y: value.y };
    return null;
  }
  const cur = { x: prev.x + (value.x - prev.x) * k, y: prev.y + (value.y - prev.y) * k };
  HANDS[prevKey] = cur;
  return { x: cur.x - prev.x, y: cur.y - prev.y };
}

function handleOne(info) {
  const pinching = info.pinch < (HANDS.pinchOn ? 0.62 : 0.48);
  const fist = !pinching && info.ext < (HANDS.fistOn ? 1.08 : 0.9);
  HANDS.pinchOn = pinching;
  HANDS.fistOn = fist;

  const palmDelta = smoothDelta('prevPalm', info.palm);
  const pinchDelta = smoothDelta('prevPinch', info.pinchPt);

  if (pinching) {
    if (pinchDelta) state.zoom = clamp(state.zoom + pinchDelta.y * 0.95, ZMIN, ZMAX);
    state.activeUntil = performance.now() + 150;
    setBadge('pinch', 'Pinch · Zoom');
  } else if (fist) {
    state.velX *= 0.72;
    state.velY *= 0.72;
    state.activeUntil = performance.now() + 150;
    setBadge('fist', 'Fist · Brake');
  } else {
    if (palmDelta) rotateBy(-palmDelta.x * 2.4, palmDelta.y * 2.8);
    setBadge('open', 'Open Palm · Orbit');
  }
}

function handleTwo(infos) {
  const p0 = infos[0].palm;
  const p1 = infos[1].palm;
  const mid = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
  const span = Math.hypot((p0.x - p1.x) * videoAspect(), p0.y - p1.y);

  const midDelta = smoothDelta('prevMid', mid, 0.4);
  if (midDelta) rotateBy(-midDelta.x * 2.0, midDelta.y * 2.4);

  const prev = HANDS.prevSpan;
  const smoothed = prev > 0 ? prev + (span - prev) * 0.4 : span;
  HANDS.prevSpan = smoothed;
  if (prev > 0.02 && smoothed > 0.02) {
    const ratio = clamp(prev / smoothed, 0.94, 1.06);
    zoomBy(Math.pow(ratio, 0.45));
  }

  HANDS.pinchOn = false;
  HANDS.fistOn = false;
  setBadge('two', 'Two Hands · Zoom');
}

function processResult(res, now) {
  const hands = (res && res.landmarks) || [];
  const aspect = videoAspect();

  if (hands.length === 0) {
    if (++HANDS.missed > 6) {
      resetHands();
      setBadge('none', 'No Hand');
    }
    return;
  }
  HANDS.missed = 0;

  const mode = hands.length >= 2 ? 'two' : 'one';
  if (mode !== HANDS.mode) {
    resetHands();
    HANDS.mode = mode;
  }

  const infos = hands.slice(0, mode === 'two' ? 2 : 1).map((h) => handInfo(h, aspect));
  if (mode === 'two') handleTwo(infos);
  else handleOne(infos[0]);

  drawOverlay(hands, aspect);
}

function drawOverlay(hands) {
  if (!overlay.width || !overlay.height) return;
  octx.clearRect(0, 0, overlay.width, overlay.height);
  if (!hands.length) return;

  const W = overlay.width;
  const H = overlay.height;
  const color = HANDS.pinchOn ? 'rgba(255,207,122,.85)' : 'rgba(99,230,255,.8)';

  for (const hand of hands) {
    octx.strokeStyle = color;
    octx.lineWidth = Math.max(1.5, W / 420);
    octx.lineCap = 'round';
    for (const [a, b] of CONNECTIONS) {
      octx.beginPath();
      octx.moveTo(hand[a].x * W, hand[a].y * H);
      octx.lineTo(hand[b].x * W, hand[b].y * H);
      octx.stroke();
    }
    octx.fillStyle = 'rgba(255,255,255,.92)';
    for (let i = 0; i < hand.length; i++) {
      const big = i === 4 || i === 8 || i === 12 || i === 16 || i === 20;
      octx.beginPath();
      octx.arc(hand[i].x * W, hand[i].y * H, big ? 3.2 : 2.2, 0, Math.PI * 2);
      octx.fill();
    }
  }
}

function updateHands(now) {
  if (!landmarker || !videoReady || vid.readyState < 2) return;
  if (vid.currentTime === lastVideoTime) return;
  lastVideoTime = vid.currentTime;

  let res;
  try {
    res = landmarker.detectForVideo(vid, now);
  } catch (err) {
    return;
  }
  processResult(res, now);
}

/* ------------------------------------------------------------------ */
/* camera / model bootstrap                                           */
/* ------------------------------------------------------------------ */
function showGateError(message) {
  gateNote.textContent = message + ' 可以继续用鼠标拖动地球。';
  gateNote.classList.add('err');
  gate.classList.remove('hidden');
  startBtn.textContent = '重试摄像头';
}

async function startCamera() {
  if (starting || landmarker) return;
  starting = true;

  gate.classList.add('hidden');
  camPanel.classList.add('live');
  camState.textContent = 'REQUESTING CAMERA…';
  camToggle.dataset.live = '0';
  camToggle.classList.remove('hidden');

  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
      audio: false,
    });
    vid.srcObject = cameraStream;
    await vid.play();
    videoReady = true;

    overlay.width = vid.videoWidth || 640;
    overlay.height = vid.videoHeight || 480;

    camState.textContent = 'LOADING MODEL…';
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fileset = await vision.FilesetResolver.forVisionTasks(WASM_URL);

    const options = (delegate) => ({
      baseOptions: { modelAssetPath: MODEL_URL, delegate },
      runningMode: 'VIDEO',
      numHands: 2,
      minHandDetectionConfidence: 0.6,
      minHandPresenceConfidence: 0.55,
      minTrackingConfidence: 0.55,
    });

    try {
      landmarker = await vision.HandLandmarker.createFromOptions(fileset, options('GPU'));
    } catch (gpuErr) {
      landmarker = await vision.HandLandmarker.createFromOptions(fileset, options('CPU'));
    }

    camState.textContent = 'TRACKING';
    camToggle.classList.remove('hidden');
    camToggle.dataset.live = '1';
    setBadge('none', 'No Hand');
    gateNote.textContent = '需要允许摄像头权限；模型与纹理首次加载需要联网。';
    gateNote.classList.remove('err');
    startBtn.textContent = '开启摄像头';
  } catch (err) {
    const msg = err && err.message ? err.message : String(err);
    camState.textContent = 'CAMERA OFF';
    camPanel.classList.remove('live');
    showGateError('摄像头或模型加载失败：' + msg + '。');
    if (cameraStream) {
      cameraStream.getTracks().forEach((t) => t.stop());
      cameraStream = null;
    }
    videoReady = false;
  } finally {
    starting = false;
  }
}

startBtn.addEventListener('click', startCamera);
camToggle.addEventListener('click', startCamera);
mouseBtn.addEventListener('click', () => {
  gate.classList.add('hidden');
  setBadge('none', 'Mouse / Touch');
});

/* ------------------------------------------------------------------ */
/* frame loop                                                         */
/* ------------------------------------------------------------------ */
fitCamera();
window.addEventListener('resize', fitCamera);

let lastFrame = performance.now();

function animate(now) {
  requestAnimationFrame(animate);
  const dt = clamp((now - lastFrame) / 1000, 0.001, 0.05);
  lastFrame = now;

  updateHands(now);

  if (now > state.activeUntil) {
    if (Math.abs(state.velY) > 0.002 || Math.abs(state.velX) > 0.002) {
      yawBy(state.velY * dt);
      pitchBy(state.velX * dt);
      const decay = Math.exp(-dt * 2.3);
      state.velY *= decay;
      state.velX *= decay;
    } else {
      state.velY = 0;
      state.velX = 0;
    }

    const idle = clamp((now - state.activeUntil - 1400) / 2000, 0, 1);
    if (idle > 0) yawBy(idle * 0.11 * dt);
  }

  const targetZ = state.baseZ * state.zoom;
  camera.position.z += (targetZ - camera.position.z) * Math.min(1, dt * 8);

  globe.quaternion.normalize();
  renderer.render(scene, camera);
}

requestAnimationFrame(animate);
</script>
